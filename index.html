<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weepshop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background-color: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; justify-content: center; height: 100vh; box-sizing: border-box; }
    .menu-btn { padding: 15px 30px; border-radius: 10px; border: none; background: #8b5cf6; color: white; font-size: 18px; cursor: pointer; margin-top: 20px; }
    
    .card {
      display: none;
      height: 25vh;
      background-color: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      position: relative;
    }
    .card-title { font-size: 18px; font-weight: bold; margin: 0; }
    .card-price { font-size: 16px; color: #8b5cf6; margin: 5px 0; font-weight: bold; }
    .card-btn { padding: 10px; border-radius: 8px; border: none; background: #8b5cf6; color: white; font-size: 14px; cursor: pointer; width: 100%; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="mainMenu">
    <h1>Магазин Weepshop</h1>
    <button class="menu-btn" onclick="openProduct()">Открыть товар</button>
  </div>

  <div id="productCard" class="card">
    <button class="close-btn" onclick="closeProduct()">✕</button>
    <div>
      <p class="card-title">Xros 3 mini</p>
      <p class="card-price">2000 руб.</p>
    </div>
    <button class="card-btn" onclick="window.Telegram.WebApp.showAlert('Вы заказали Xros 3 mini!')">Заказать</button>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    function openProduct() {
      document.getElementById('mainMenu').style.display = 'none';
      document.getElementById('productCard').style.display = 'flex';
    }

    function closeProduct() {
      document.getElementById('productCard').style.display = 'none';
      document.getElementById('mainMenu').style.display = 'block';
    }
  </script>
</body>
</html>
